/*
 * Used for Build scripts/plugins only
*/

buildscript {
    repositories {
        mavenCentral()
    }

    dependencies {
        classpath 'com.netflix.nebula:gradle-aggregate-javadocs-plugin:3.0.1'
    }
}

/*
 * Plugins for this parent module only - so just high level project related
 */


plugins {
        //id "nebula.lint" version "16.9.0"
        //id "nebula-aggregate-javadocs"
    }

/* run './gradlew aggregateJavadocs' at top level to build all docs & output to build/docs/javadoc */
apply plugin: 'nebula-aggregate-javadocs'



/*
 * Configuration for all projects - INCLUDING this one
 */

    group = 'org.odpi.egeria'
    version = 1


    repositories {
         jcenter()
         mavenCentral()
         // snapshots of egeria core ie -SNAPSHOT
         maven { url("https://odpi.jfrog.io/odpi/egeria-snapshot") }
    }



    // This enforces version checking but is slow to process
    //apply plugin: 'nebula.lint'
    //gradleLint {
    //    rules = ['all-dependency'] // TODO: Change to criticalRules when ready to enforce
    //
    //}


/*
 * Configuration for sub projects only
 */
apply plugin: 'java-library'


    // Mostly java, so default to this for now
    apply plugin: 'java'

    // As we've migrated from maven - we'll assume all submodules publish directly to maven
    apply plugin: 'maven-publish'
    ext {
        egeriaversion = '3.3-SNAPSHOT'
        atlasversion  = '2.2.0'
        logbackVersion = '1.2.6'
        jacksonVersion = '2.12.2'
        mockitoVersion = '3.12.4'
        junitjupiterVersion = '5.8.1'
        httpcoreVersion = '4.4.14'
    }
    // Dependency Management - to fix versions. Pick up maven build settings for now
    dependencies {

            implementation "org.slf4j:slf4j-api:${logbackVersion}"
            implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
            implementation "com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}"
            implementation "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}"
            implementation "com.fasterxml.jackson.core:jackson-datatype-jsr310:${jacksonVersion}"
            implementation "org.junit.jupiter:junit-jupiter:${junitjupiterVersion}"
            implementation "org.odpi.egeria:open-connector-framework:${junitjupiterVersion}"
            implementation "org.odpi.egeria:audit-log-framework:${egeriaversion}"
            implementation "org.odpi.egeria:repository-services:${egeriaversion}"
            implementation "org.apache.atlas:atlas-common:${altasversion}"
            implementation "org.apache.atlas:atlas-client-v2:${altasversion}"
            implementation "org.apache.atlas:atlas-intg:${altasversion}"
            implementation "org.apache.atlas:atlas-client-common:${altasversion}"
            implementation "org.apache.atlas:atlas-notification:${altasversion}"
    }

    // sources required to publish a legitimate maven package for distribution
    java {
        withSourcesJar()
    }

    test {
        useJUnitPlatform()
        dependencies {
            testCompile("org.junit.jupiter:junit-jupiter-api:5.7.0")
            testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.7.0"
            testImplementation "org.junit.jupiter:junit-jupiter-params:5.7.0"
            testImplementation("org.junit.jupiter:junit-jupiter-api:5.7.0")
        }

        testLogging {
            events "passed", "skipped", "failed"
        }

        reports {
            html.enabled = true
        }

        filter {
           //include all unit tests
           includeTestsMatching "*Test"

        }
    }

    // publish maven package
    publishing {
        publications {
            maven(MavenPublication) {
                from(components.java)
            }
        }
    }

    // Java language settings
    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
        sourceCompatibility = "1.8"
        targetCompatibility = "1.8"
    }
